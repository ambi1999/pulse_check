# Runs when you push a version tag like v1.0.0: create a GitHub Release.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write  # needed to create the release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build APK (version taken from the tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "pulse-check-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pulse-check-${{ github.ref_name }}.apk
          generate_release_notes: true
